<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Alien Star War: Evolved Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
  <style>
    body { padding: 0; margin: 0; overflow: hidden; background-color: #010103; }
    canvas { display: block; }
  </style>
</head>
<body>

<script>
  // --- ESTADOS DEL JUEGO ---
  let estadoJuego = "MENU"; 

  // --- VARIABLES DEL MOTOR ---
  let jugador;
  let proyectiles = [];
  let laserEnemigos = [];
  let enemigos = [];
  let particulas = [];
  let powerups = [];
  let fondoEstrellas = [];
  
  let puntuacion = 0;
  let nivelActual = 1;
  let sacudidaPantalla = 0;
  let jefeActual = null;
  let jefeAparecido = false;

  // Transición de hiperespacio
  let tiempoContadorHiperespacio = 0;
  let duracionHiperespacio = 5000; 
  let creditosEntregadosEnEsteNivel = false;

  // --- SISTEMA DE PROGRESIÓN Y HANGAR (10 NAVES DETALLADAS) ---
  let naveSeleccionada = 0;
  let dificultadSeleccionada = 1; 
  let listaDificultades = ["FÁCIL", "NORMAL", "PESADILLA"];
  let multiplicadorDificultad = 1.0;
  let creditosEstelares = 0;

  const catalogoNaves = [
    { nombre: "FLEA-X1", color: [160, 170, 185], vel: 8.5, escudoMax: 80, precio: 0, mass: 0.6, weapon: "Quantum Pulse", desc: "Caza ligero de reconnaissance. Ultra veloz pero muy frágil." },
    { nombre: "SWIFT BLADE", color: [50, 120, 200], vel: 7.8, escudoMax: 110, precio: 15, mass: 0.9, weapon: "Quantum Pulse", desc: "Interceptor aerodinámico optimizado para guerrillas rápidas." },
    { nombre: "AEGIS VANGUARD", color: [200, 200, 210], vel: 6.5, escudoMax: 150, precio: 30, mass: 1.6, weapon: "Railgun", desc: "Caza Pesado Estándar. Cañón de riel cinético de alta perforación." },
    { nombre: "SHADOW WRAITH", color: [60, 65, 80], vel: 6.0, escudoMax: 130, precio: 45, mass: 1.1, weapon: "Vortex Emitter", desc: "Prototipo sigiloso con dispersores de energía cuántica." },
    { nombre: "HELIOS STORM", color: [240, 110, 0], vel: 5.2, escudoMax: 200, precio: 65, mass: 2.1, weapon: "Plasma Mortar", desc: "Fragata de artillería térmica. Desata morteros de plasma pesado." },
    { nombre: "CHRONOS SHIFT", color: [140, 50, 230], vel: 5.5, escudoMax: 180, precio: 85, mass: 1.5, weapon: "Vortex Emitter", desc: "Caza táctico con modificadores de flujo de antimateria." },
    { nombre: "APEX PREDATOR", color: [40, 150, 60], vel: 4.5, escudoMax: 260, precio: 110, mass: 3.2, weapon: "Fusion Missiles", desc: "Acorazado táctico. Cargado con lanzamisiles de fusión guiados." },
    { nombre: "TITAN AEGIS", color: [110, 120, 135], vel: 3.8, escudoMax: 350, precio: 140, mass: 4.5, weapon: "Railgun", desc: "Plataforma blindada búnker. Capaz de resistir impactos severos." },
    { nombre: "ECLIPSE MK-9", color: [30, 32, 40], vel: 3.2, escudoMax: 450, precio: 180, mass: 5.2, weapon: "Plasma Mortar", desc: "Destructor superpesado con blindaje reforzado de titanio oscuro." },
    { nombre: "OMEGA LEVIATHAN", color: [220, 180, 50], vel: 2.5, escudoMax: 600, precio: 250, mass: 7.0, weapon: "Fusion Missiles", desc: "Nave Nodriza Suprema. El coloso definitivo del arsenal estelar." }
  ];

  let navesDesbloqueadas = [true, false, false, false, false, false, false, false, false, false];

  // --- MOTOR DE AUDIO ---
  let oscAudio; 
  let sintesMúsica = []; 
  let indiceNota = 0;
  let audioIniciado = false;

  const CONFIG_MUSICAL = {
    1: { notas: [60, 62, 64, 67, 60, 62, 64, 69], tipoBajo: 'sawtooth', tipoArp: 'sine', tempo: 12 },    
    2: { notas: [57, 60, 64, 65, 57, 60, 64, 67], tipoBajo: 'triangle', tipoArp: 'triangle', tempo: 10 }, 
    3: { notas: [48, 51, 48, 53, 48, 51, 48, 46], tipoBajo: 'square', tipoArp: 'sawtooth', tempo: 8 },    
    4: { notas: [60, 66, 63, 60, 69, 63, 66, 59], tipoBajo: 'sawtooth', tipoArp: 'square', tempo: 14 },   
    5: { notas: [50, 53, 52, 50, 57, 55, 53, 56], tipoBajo: 'square', tipoArp: 'square', tempo: 7 }       
  };

  let btnIzq, btnDer, btnDisp;
  let btnNavePrev, btnNaveSig, btnDifPrev, btnDifSig, btnIniciar;

  function setup() {
    createCanvas(windowWidth, windowHeight);
    pixelDensity(1); 
    
    try {
      if (localStorage.getItem("creditosEstelares")) {
        creditosEstelares = parseInt(localStorage.getItem("creditosEstelares")) || 0;
      }
      if (localStorage.getItem("navesDesbloqueadas")) {
        let guardadas = JSON.parse(localStorage.getItem("navesDesbloqueadas"));
        if (guardadas && guardadas.length === catalogoNaves.length) navesDesbloqueadas = guardadas;
      }
    } catch (e) {
      creditosEstelares = 0;
    }

    oscAudio = new p5.Oscillator('sawtooth');
    oscAudio.amp(0);
    oscAudio.start();

    sintesMúsica[0] = new p5.Oscillator('triangle');
    sintesMúsica[0].amp(0);
    sintesMúsica[0].start();
    
    sintesMúsica[1] = new p5.Oscillator('sawtooth');
    sintesMúsica[1].amp(0);
    sintesMúsica[1].start();
    
    for (let i = 0; i < 100; i++) {
      fondoEstrellas.push({ 
        x: random(width), 
        y: random(height), 
        velocidad: random(0.3, 5.0), 
        tam: random(0.5, 3.5),
        brillo: random(100, 255)
      });
    }

    configurarBotones();
  }

  function draw() {
    background(2, 2, 8);
    
    if (sacudidaPantalla > 0) {
      translate(random(-sacudidaPantalla, sacudidaPantalla), random(-sacudidaPantalla, sacudidaPantalla));
      sacudidaPantalla *= 0.85;
    }

    actualizarFondoDinamico();
    gestionarMusica(); 

    if (estadoJuego === "MENU") {
      dibujarMenuHangar();
    } else if (estadoJuego === "GAMEOVER") {
      mostrarPantallaFin();
    } else if (estadoJuego === "JUGANDO" || estadoJuego === "HIPERESPACIO") {
      ejecutarLoopJuego();
    }
  }

  function ejecutarLoopJuego() {
    gestionarToques();

    if (jugador) {
      jugador.actualizar();
      jugador.dibujar();
      
      if (frameCount % 2 === 0) {
        let c = catalogoNaves[naveSeleccionada].color;
        let fv = estadoJuego === "HIPERESPACIO" ? 5 : 1;
        particulas.push(new Particula(jugador.x + jugador.w/2, jugador.y + jugador.h, color(c[0], c[1], c[2]), random(-0.5, 0.5), random(2, 4) * fv, 8));
      }
    }

    if (estadoJuego === "HIPERESPACIO") {
      let tiempoTranscurrido = millis() - tiempoContadorHiperespacio;
      let restanteVisual = Math.max(0, Math.ceil((duracionHiperespacio - tiempoTranscurrido) / 1000));

      if (!creditosEntregadosEnEsteNivel) {
        creditosEstelares += 20 + (nivelActual * 5); 
        localStorage.setItem("creditosEstelares", creditosEstelares); 
        creditosEntregadosEnEsteNivel = true;
      }

      push();
      textAlign(CENTER, CENTER);
      fill(0, 255, 200, 200 + sin(frameCount * 0.2) * 55);
      textSize(28); textStyle(BOLD);
      text("¡SECTOR CONQUISTADO!", width / 2, height / 2 - 50);
      
      fill(255, 215, 0); textSize(18);
      text(`+${20 + (nivelActual * 5)} CRÉDITOS ESTELARES RECOLECTADOS`, width / 2, height / 2 - 15);
      
      fill(255); textSize(15); textStyle(NORMAL);
      text(`SALTANDO AL PRÓXIMO SECTOR EN: ${restanteVisual}s`, width / 2, height / 2 + 25);
      pop();

      if (tiempoTranscurrido >= duracionHiperespacio) {
        nivelActual++;
        jefeAparecido = false;
        jefeActual = null;
        inicializarNivel();
        estadoJuego = "JUGANDO";
      }
    }

    for (let i = proyectiles.length - 1; i >= 0; i--) {
      if (!proyectiles[i]) continue;
      
      proyectiles[i].actualizar();
      proyectiles[i].dibujar();

      if (proyectiles[i].fueraDePantalla()) {
        proyectiles.splice(i, 1);
        continue;
      }

      if (estadoJuego === "JUGANDO") {
        let proyectilEliminado = false;

        for (let j = enemigos.length - 1; j >= 0; j--) {
          if (!enemigos[j] || !proyectiles[i]) continue;
          
          if (proyectiles[i].colisionaCon(enemigos[j])) {
            let destruido = enemigos[j].recibirDanio(proyectiles[i].damage);
            sacudidaPantalla = proyectiles[i].weaponType === "Railgun" ? 6 : 3;

            if (destruido) {
              reproducirSonidoExplosion();
              crearExplosionMetalica(enemigos[j].x + enemigos[j].w/2, enemigos[j].y + enemigos[j].h/2, enemigos[j].colorEfecto, 35);
              sacudidaPantalla = 10;
              puntuacion += Math.floor(60 * nivelActual * multiplicadorDificultad);

              if (random(1) < 0.25) {
                powerups.push(new PowerUp(enemigos[j].x + enemigos[j].w/2, enemigos[j].y));
              }
              enemigos.splice(j, 1);
            } else {
              reproducirSonidoImpacto();
              crearExplosionMetalica(proyectiles[i].x, proyectiles[i].y, color(255), 4);
            }
            
            if (proyectiles[i].weaponType !== "Railgun") {
              proyectiles.splice(i, 1);
              proyectilEliminado = true;
              break; 
            }
          }
        }

        if (proyectilEliminado) continue;

        if (jefeActual && proyectiles[i] && proyectiles[i].colisionaCon(jefeActual)) {
          let jefeMuerto = jefeActual.recibirDanio(proyectiles[i].damage);
          sacudidaPantalla = 7;
          reproducirSonidoImpacto();
          crearExplosionMetalica(proyectiles[i].x, proyectiles[i].y, jefeActual.colorEfecto, 5);

          if (jefeMuerto) {
            reproducirSonidoExplosion();
            crearExplosionMetalica(jefeActual.x + jefeActual.w/2, jefeActual.y + jefeActual.h/2, jefeActual.colorEfecto, 130);
            sacudidaPantalla = 45;
            puntuacion += Math.floor(1000 * nivelActual * multiplicadorDificultad);
            
            // 🌟 MODIFICACIÓN: Recuperar la vida (escudo) del jugador al 100%
            if (jugador) {
              jugador.repararEscudo(jugador.escudoMax);
              jugador.destellarEscudo(); // Efecto visual azul de escudo activado
            }

            enemigos = []; 
            jefeActual = null;
            estadoJuego = "HIPERESPACIO";
            creditosEntregadosEnEsteNivel = false; 
            tiempoContadorHiperespacio = millis(); 
          }
          
          if (proyectiles[i] && proyectiles[i].weaponType !== "Railgun") {
            proyectiles.splice(i, 1);
          }
        }
      }
    }

    for (let i = laserEnemigos.length - 1; i >= 0; i--) {
      if (!laserEnemigos[i]) continue;
      
      laserEnemigos[i].actualizar();
      laserEnemigos[i].dibujar();
      
      if (laserEnemigos[i].fueraDePantalla()) { 
        laserEnemigos.splice(i, 1); 
        continue; 
      }

      if (estadoJuego === "JUGANDO" && jugador && laserEnemigos[i].colisionaConJugador(jugador)) {
        let danioRecibido = laserEnemigos[i].tipo === "MINA" ? 40 : 15;
        jugador.escudo -= Math.floor(danioRecibido * multiplicadorDificultad); 
        jugador.destellarEscudo();
        reproducirSonidoDanioJugador();
        sacudidaPantalla = 20;
        laserEnemigos.splice(i, 1);
        if (jugador.escudo <= 0) { estadoJuego = "GAMEOVER"; reproducirSonidoDerrota(); }
        continue;
      }
    }

    if (estadoJuego === "JUGANDO") {
      let cambiarDireccion = false;
      for (let i = enemigos.length - 1; i >= 0; i--) {
        if (!enemigos[i]) continue;
        enemigos[i].actualizar();
        enemigos[i].dibujar();
        if (enemigos[i].tocaBorde()) cambiarDireccion = true;
        if (random(1) < enemigos[i].probabilidadDisparo) enemigos[i].disparar();
        if (jugador && enemigos[i].y + enemigos[i].h >= jugador.y) { estadoJuego = "GAMEOVER"; reproducirSonidoDerrota(); }
      }
      
      if (cambiarDireccion) { 
        for (let enemigo of enemigos) { if(enemigo) enemigo.rebotar(); } 
      }

      if (enemigos.length === 0 && !jefeAparecido) {
        jefeActual = new MegaJefeInvasor(width / 2 - 90, -160, nivelActual);
        jefeAparecido = true;
      }

      if (jefeActual) {
        jefeActual.actualizar();
        jefeActual.dibujar();
        if (random(1) < jefeActual.probabilidadDisparo) jefeActual.disparar();
        if (jugador && jefeActual.y + jefeActual.h >= jugador.y) { estadoJuego = "GAMEOVER"; reproducirSonidoDerrota(); }
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      if (!powerups[i]) continue;
      powerups[i].actualizar(); 
      powerups[i].dibujar();
      if (jugador && powerups[i].colisionaConJugador(jugador)) {
        reproducirSonidoPowerUp();
        jugador.repararEscudo(Math.floor(50 / multiplicadorDificultad));
        powerups.splice(i, 1); 
        continue;
      }
      if (powerups[i].fueraDePantalla()) powerups.splice(i, 1);
    }

    for (let i = particulas.length - 1; i >= 0; i--) {
      if (!particulas[i]) continue;
      particulas[i].actualizar(); 
      particulas[i].dibujar();
      if (particulas[i].estaMuerta()) particulas.splice(i, 1);
    }

    resetMatrix(); 
    dibujarUI();
    dibujarBotonesUI();
  }

  function dibujarMenuHangar() {
    push();
    textAlign(CENTER, TOP);
    fill(0, 195, 255); textSize(32); textStyle(BOLD);
    text("ALIEN STAR WAR: EVOLVED PRO", width / 2, 45);
    
    fill(255, 215, 0); textSize(15);
    text(`✪ CRÉDITOS DISPONIBLES: ${creditosEstelares} CR`, width / 2, 85);
    
    let nX = width / 2;
    let nY = height * 0.28;
    
    fill(10, 30, 60, 80); ellipse(nX, nY + 45, 140, 24);
    stroke(0, 215, 255, 60); strokeWeight(1); noFill(); ellipse(nX, nY + 45, 160, 32); noStroke();

    let naveActual = catalogoNaves[naveSeleccionada];
    let estaDesbloqueada = navesDesbloqueadas[naveSeleccionada];

    push(); translate(nX - 27, nY - 15); scale(1.4);
    if (estaDesbloqueada) {
      dibujarEstructuraNave(naveSeleccionada, 0, 0, true);
    } else {
      push(); tint(255, 40, 40, 90);
      dibujarEstructuraNave(naveSeleccionada, 0, 0, false);
      pop();
    }
    pop();

    if (!estaDesbloqueada) {
      fill(255, 50, 70); textSize(14); textStyle(BOLD);
      text(`🔒 PROTOTIPO BLOQUEADO (COSTO: ${naveActual.precio} CR)`, width / 2, height * 0.42);
    }

    fill(255); textSize(22); textStyle(BOLD); text(naveActual.nombre, width / 2, height * 0.46);
    fill(160, 170, 190); textSize(13); textStyle(NORMAL); text(naveActual.desc, width / 2, height * 0.50);
    
    fill(0, 255, 180); text(`BLINDAJE DE CASCO: ${naveActual.escudoMax} HP | SISTEMA DE ARMAS: ${naveActual.weapon}`, width / 2, height * 0.53);
    fill(255, 200, 0); text(`PROPULSIÓN / MASA: ${naveActual.vel} MACH / ${naveActual.mass}t (Inercial)`, width / 2, height * 0.56);

    fill(20, 15, 35); rect(width/2 - 110, height * 0.63, 220, 45, 6);
    fill(140, 150, 180); textSize(12); text("DIFICULTAD DE SECTOR", width/2, height * 0.60);
    
    let colorDif = [0, 255, 150];
    if (dificultadSeleccionada === 1) colorDif = [255, 160, 0];
    if (dificultadSeleccionada === 2) colorDif = [255, 40, 60];
    fill(colorDif[0], colorDif[1], colorDif[2]); textSize(20); textStyle(BOLD);
    text(listaDificultades[dificultadSeleccionada], width/2, height * 0.64);

    textStyle(NORMAL);
    fill(22, 28, 48); rect(btnNavePrev.x, btnNavePrev.y, btnNavePrev.w, btnNavePrev.h, 6);
    rect(btnNaveSig.x, btnNaveSig.y, btnNaveSig.w, btnNaveSig.h, 6);
    rect(btnDifPrev.x, btnDifPrev.y, btnDifPrev.w, btnDifPrev.h, 6);
    rect(btnDifSig.x, btnDifSig.y, btnDifSig.w, btnDifSig.h, 6);
    
    if (estaDesbloqueada) {
      fill(12, 175, 95); 
    } else {
      if (creditosEstelares >= naveActual.precio) fill(210, 140, 10); else fill(70, 35, 45);
    }
    rect(btnIniciar.x, btnIniciar.y, btnIniciar.w, btnIniciar.h, 10);

    fill(255); textSize(14); textAlign(CENTER, CENTER);
    text("◀ NAVE", btnNavePrev.x + btnNavePrev.w/2, btnNavePrev.y + btnNavePrev.h/2);
    text("NAVE ▶", btnNaveSig.x + btnNaveSig.w/2, btnNaveSig.y + btnNaveSig.h/2);
    text("◀ DIFIC", btnDifPrev.x + btnDifPrev.w/2, btnDifPrev.y + btnDifPrev.h/2);
    text("DIFIC ▶", btnDifSig.x + btnDifSig.w/2, btnDifSig.y + btnDifSig.h/2);
    
    textSize(18); textStyle(BOLD); 
    if (estaDesbloqueada) {
      text("DESPEGAR", btnIniciar.x + btnIniciar.w/2, btnIniciar.y + btnIniciar.h/2);
    } else {
      if (creditosEstelares >= naveActual.precio) {
        text("COMPRAR MODELO", btnIniciar.x + btnIniciar.w/2, btnIniciar.y + btnIniciar.h/2);
      } else {
        text("CRÉDITOS INSUFICIENTES", btnIniciar.x + btnIniciar.w/2, btnIniciar.y + btnIniciar.h/2);
      }
    }
    pop();
  }

  // --- MOTOR DE RENDERING VECTORIAL AVANZADO (10 NAVES DETALLADAS) ---
  function dibujarEstructuraNave(tipo, x, y, animarPropulsor) {
    push(); translate(x, y); noStroke();
    let c = catalogoNaves[tipo].color;

    if (animarPropulsor && random(1) > 0.2) {
      let extY = tipo >= 7 ? 36 : (tipo >= 4 ? 30 : 25);
      fill(255, random(80, 200), 0, 220);
      ellipse(27, extY, random(10, 22), random(15, 32));
      fill(255, 255, 140, 240);
      ellipse(27, extY - 3, random(5, 10), random(8, 18));
      
      if (tipo >= 6) {
        fill(0, 190, 255, 200);
        ellipse(8, extY - 5, 6, random(10, 20));
        ellipse(46, extY - 5, 6, random(10, 20));
      }
    }

    if (tipo === 0) { 
      fill(c[0]-30, c[1]-30, c[2]-30); triangle(27, 2, 12, 26, 42, 26);
      fill(c[0], c[1], c[2]); triangle(27, 4, 18, 24, 36, 24);
      fill(0, 235, 255, 200); ellipse(27, 12, 5, 8); 
    } 
    else if (tipo === 1) { 
      fill(c[0]-40, c[1]-40, c[2]-40); quad(27, 0, 5, 20, 27, 16, 49, 20);
      fill(c[0], c[1], c[2]); quad(27, 3, 12, 18, 27, 14, 42, 18);
      fill(255, 50, 50); rect(10, 15, 2, 7); rect(42, 15, 2, 7); 
      fill(0, 255, 200); triangle(25, 6, 27, 11, 29, 6);
    } 
    else if (tipo === 2) { 
      fill(110, 115, 125); quad(0, 24, 27, 0, 54, 24, 27, 18);
      fill(c[0], c[1], c[2]); quad(10, 20, 27, 2, 44, 20, 27, 16); 
      fill(0, 255, 255); triangle(23, 4, 27, 13, 31, 4); 
      fill(0, 150, 255); rect(2, 22, 4, 4); rect(48, 22, 4, 4); 
    } 
    else if (tipo === 3) { 
      fill(30, 32, 42); rect(6, 4, 42, 22, 5);
      fill(c[0], c[1], c[2]); rect(14, 2, 26, 24, 3);
      fill(150, 0, 255, 180); ellipse(27, 10, 10, 5); 
      fill(90, 40, 130); triangle(1, 14, 10, 4, 10, 24); triangle(53, 14, 44, 4, 44, 24);
    } 
    else if (tipo === 4) { 
      fill(160, 50, 0); triangle(27, -2, 4, 26, 50, 26);
      fill(c[0], c[1], c[2]); triangle(27, 2, 12, 24, 42, 24);
      fill(255, 200, 0); ellipse(27, 12, 12, 12); 
      fill(230, 30, 30); rect(2, 18, 5, 8); rect(47, 18, 5, 8);
    } 
    else if (tipo === 5) { 
      fill(60, 15, 110); quad(12, 0, 42, 0, 52, 24, 2, 24);
      fill(c[0], c[1], c[2]); quad(16, 3, 38, 3, 46, 21, 8, 21);
      let pulse = 130 + sin(frameCount * 0.2) * 110;
      fill(0, 255, 180, pulse); ellipse(27, 11, 14, 14); 
    } 
    else if (tipo === 6) { 
      fill(20, 60, 20); rect(2, 0, 50, 26, 6);
      fill(c[0], c[1], c[2]); rect(12, 4, 30, 24, 3);
      fill(190, 200, 210); rect(18, 1, 18, 5);
      fill(255, 60, 60); rect(6, 23, 5, 5); rect(43, 23, 5, 5);
    } 
    else if (tipo === 7) { 
      fill(70, 75, 85); rect(0, 5, 54, 24, 4);
      fill(c[0], c[1], c[2]); rect(8, 0, 38, 28, 6);
      fill(100, 200, 255, 150); rect(16, 6, 22, 10, 2);
      fill(220, 220, 50); rect(3, 2, 4, 12); rect(47, 2, 4, 12);
    } 
    else if (tipo === 8) { 
      fill(15, 16, 22); beginShape(); vertex(27, 0); vertex(54, 12); vertex(44, 32); vertex(10, 32); vertex(0, 12); endShape(CLOSE);
      fill(c[0], c[1], c[2]); beginShape(); vertex(27, 4); vertex(46, 14); vertex(38, 29); vertex(16, 29); vertex(8, 14); endShape(CLOSE);
      fill(255, 0, 50, 200); ellipse(27, 15, 8, 12);
      fill(110, 120, 135); rect(12, 28, 4, 6); rect(38, 28, 4, 6);
    } 
    else if (tipo === 9) { 
      fill(140, 110, 20); rect(0, 8, 54, 24, 8);

      fill(0, 200, 255); ellipse(27, 14, 16, 10);

  function dibujarEnemigoRealista(tipo, x, y, w, h, colorEfecto) {
    push(); translate(x, y); noStroke();
    
    if (random(1) > 0.4) {
      fill(colorEfecto.levels[0], colorEfecto.levels[1], colorEfecto.levels[2], 150);
      rect(w/2 - 4, -4, 8, 4);
    }

    if (tipo === 1) { 
      fill(25, 45, 35); rect(4, 4, w - 8, h - 8, 6);

      fill(255); ellipse(w/2 - 4, h/2, 3, 3); ellipse(w/2 + 4, h/2, 3, 3); 
    } 
    else if (tipo === 2) { 
      fill(45, 25, 55); triangle(w/2, h, 0, 0, w, 0);
      fill(colorEfecto); quad(w/2 - 6, 6, w/2 + 6, 6, w/2 + 2, h - 6, w/2 - 2, h - 6);
    } 
    else if (tipo === 3) { 
      fill(55, 40, 20); rect(0, 0, w, h - 6, 4);
      fill(30); rect(6, h - 8, w - 12, 6);
      fill(colorEfecto); rect(8, 4, w - 16, 6, 2); 
    } 
    else { 
      fill(35, 45, 55); beginShape(); vertex(w/2, 0); vertex(w, 10); vertex(w - 6, h); vertex(6, h); vertex(0, 10); endShape(CLOSE);
      fill(colorEfecto); ellipse(w/2, h/2, 16, 16);
      stroke(colorEfecto.levels[0], colorEfecto.levels[1], colorEfecto.levels[2], 80);
      strokeWeight(2); noFill(); ellipse(w/2, h/2, 24 + sin(frameCount*0.1)*4);
    }

  function actualizarFondoDinamico() {
    noStroke(); fill(3, 2, 12, 40); rect(0, 0, width, height);

    for (let estrella of fondoEstrellas) {
      let modVelocidad = estadoJuego === "HIPERESPACIO" ? estrella.velocidad * 9.0 : estrella.velocidad;

      if (estadoJuego === "MENU") {
        fill(255, 255, 255, 120); estrella.y += modVelocidad * 0.2;
      } else if (nivelActual % 3 === 1) {
        fill(170, 230, 255, estrella.brillo); estrella.y += modVelocidad;
      } else if (nivelActual % 3 === 2) {
        fill(255, 120, 240, estrella.brillo); estrella.y += modVelocidad * 0.9;
      } else {
        fill(255, 210, 110, estrella.brillo); estrella.y += modVelocidad * 1.4;
      }

      if (estrella.y > height) { estrella.y = 0; estrella.x = random(width); }
    
      if (estadoJuego === "HIPERESPACIO") {
        stroke(200, 245, 255, 200); strokeWeight(estrella.tam * 0.7);
        line(estrella.x, estrella.y, estrella.x, estrella.y + 30); noStroke();
      } else {
        ellipse(estrella.x, estrella.y, estrella.tam);
      }
    }
  }

  function gestionarMusica() {
    if (!audioIniciado || estadoJuego === "GAMEOVER" || estadoJuego === "HIPERESPACIO") {
      if (sintesMúsica[0]) { sintesMúsica[0].amp(0); sintesMúsica[1].amp(0); } return;
    }
    
    let configId = ((nivelActual - 1) % 5) + 1;
    let config = CONFIG_MUSICAL[configId];
    
    let tempoVel = (jefeActual || estadoJuego === "MENU") ? Math.floor(config.tempo * 0.7) : config.tempo;
    
    if (frameCount % tempoVel === 0) {
      indiceNota = (indiceNota + 1) % config.notas.length;
      let notaActual = config.notas[indiceNota];
      let freqBajo = midiToFreq(notaActual - (estadoJuego === "MENU" ? 12 : 24));
      
      sintesMúsica[0].setType(config.tipoBajo);
      sintesMúsica[0].freq(freqBajo); 
      sintesMúsica[0].amp(0.18, 0.02); 
      sintesMúsica[0].amp(0, tempoVel * 0.07);

      if (frameCount % (tempoVel * 2) === 0) {
        let freqArp = midiToFreq(notaActual + (jefeActual ? 12 : 0));
        sintesMúsica[1].setType(config.tipoArp);
        sintesMúsica[1].freq(freqArp); 
        sintesMúsica[1].amp(0.06, 0.01); 
        sintesMúsica[1].amp(0, 0.18);
      }
    }
  }

  function reproducirSonidoLaserEnemigo() { activarContextoAudio(); oscAudio.setType('triangle'); oscAudio.freq(180); oscAudio.amp(0.08, 0.01); oscAudio.freq(400, 0.12); oscAudio.amp(0, 0.12); }
  function reproducirSonidoExplosion() { oscAudio.setType('square'); oscAudio.freq(95); oscAudio.amp(0.28, 0.01); oscAudio.freq(10, 0.45); oscAudio.amp(0, 0.45); }

  function reproducirSonidoDerrota() { oscAudio.setType('sawtooth'); oscAudio.freq(85); oscAudio.amp(0.3, 0.01); oscAudio.freq(12, 0.75); oscAudio.amp(0, 0.75); }

  function crearExplosionMetalica(x, y, col, cant) { for (let i = 0; i < cant; i++) { particulas.push(new Particula(x, y, col, random(-5, 5), random(-5, 5))); } }

  function inicializarNivel() {
    enemigos = []; laserEnemigos = [];
    let velocidadBase = (1.4 + (nivelActual * 0.25)) * multiplicadorDificultad;
    let columnas = Math.floor(width / 75);
    let filas = Math.min(2 + nivelActual, 4);
    
    for (let i = 0; i < columnas - 1; i++) {
      for (let j = 0; j < filas; j++) { 
        let tipoEnemigo = 1; 
        if (j === 1) tipoEnemigo = 2; 
        if (j === 2) tipoEnemigo = 3; 
        if (j === 3 || (nivelActual >= 3 && j === 0 && i % 2 === 0)) tipoEnemigo = 4; 

        enemigos.push(new EnemigoAlien(i * 72 + 40, j * 50 + 110, velocidadBase, tipoEnemigo)); 
      }
    }
  }

  function comenzarJuego() {
    if (dificultadSeleccionada === 0) multiplicadorDificultad = 0.7; 
    if (dificultadSeleccionada === 1) multiplicadorDificultad = 1.1; 
    if (dificultadSeleccionada === 2) multiplicadorDificultad = 1.7; 

    puntuacion = 0; nivelActual = 1; jefeActual = null; jefeAparecido = false;
    proyectiles = []; laserEnemigos = []; particulas = []; powerups = [];

  }

  function gestionarToques() {
    if(!jugador) return;
    jugador.setFuerzaX(0);
    jugador.setFuerzaY(0);
    for (let t of touches) {
      if (evaluarToque(t.x, t.y, btnIzq)) jugador.setFuerzaX(-1);
      if (evaluarToque(t.x, t.y, btnDer)) jugador.setFuerzaX(1);
    }
  }

  function touchStarted() {
    activarContextoAudio();

    if (estadoJuego === "MENU") {
      for (let t of touches) {
        if (evaluarToque(t.x, t.y, btnNavePrev)) { naveSeleccionada = (naveSeleccionada - 1 + catalogoNaves.length) % catalogoNaves.length; reproducirSonidoImpacto(); }
        if (evaluarToque(t.x, t.y, btnNaveSig)) { naveSeleccionada = (naveSeleccionada + 1) % catalogoNaves.length; reproducirSonidoImpacto(); }
        if (evaluarToque(t.x, t.y, btnDifPrev)) { dificultadSeleccionada = (dificultadSeleccionada - 1 + listaDificultades.length) % listaDificultades.length; reproducirSonidoImpacto(); }
        if (evaluarToque(t.x, t.y, btnDifSig)) { dificultadSeleccionada = (dificultadSeleccionada + 1) % listaDificultades.length; reproducirSonidoImpacto(); }
        
        if (evaluarToque(t.x, t.y, btnIniciar)) { 
          let naveTarget = catalogoNaves[naveSeleccionada];
          if (navesDesbloqueadas[naveSeleccionada]) {
            comenzarJuego();
            reproducirSonidoPowerUp();
          } else if (creditosEstelares >= naveTarget.precio) {
            creditosEstelares -= naveTarget.precio;
            navesDesbloqueadas[naveSeleccionada] = true;
            localStorage.setItem("creditosEstelares", creditosEstelares);
            localStorage.setItem("navesDesbloqueadas", JSON.stringify(navesDesbloqueadas));
            reproducirSonidoPowerUp();
          }
        }
      }
    } else if (estadoJuego === "JUGANDO" && jugador) {
      for (let t of touches) { if (evaluarToque(t.x, t.y, btnDisp)) jugador.disparar(); }
    } else if (estadoJuego === "GAMEOVER") {
      estadoJuego = "MENU"; reproducirSonidoImpacto();
    }
    return false;
  }

  function evaluarToque(tx, ty, boton) { if(!boton) return false; return (tx > boton.x && tx < boton.x + boton.w && ty > boton.y && ty < boton.y + boton.h); }

  // --- CLASES DEL ENTORNO REFORMADAS ---
  class Jugador {
    constructor(datosNave) { 
      this.w = 54; this.h = 28; 
      this.maxSpeed = datosNave.vel; 
      this.escudoMax = datosNave.escudoMax; 
      this.escudo = this.escudoMax;
      this.mass = datosNave.mass;
      this.weaponType = datosNave.weapon;
      
      this.velX = 0.0;
      this.velY = 0.0;
      this.fuerzaX = 0;
      this.fuerzaY = 0;
      this.aceleracion = 0.9 / this.mass; 
      this.friccion = 0.09;               
      
      this.maxEnergia = 100;
      this.energia = this.maxEnergia;
      
      this.x = width / 2 - this.w / 2; 
      this.y = height - 145; 
      this.alfaEscudo = 0;
      this.cooldown = 0;
    }
    
    setFuerzaX(fx) { this.fuerzaX = fx; }
    setFuerzaY(fy) { this.fuerzaY = fy; }
    
    actualizar() { 
      this.velX += this.fuerzaX * this.aceleracion;
      this.velY += this.fuerzaY * this.aceleracion;
      
      this.velX *= (1 - this.friccion);
      this.velY *= (1 - this.friccion);
      
      let speed = sqrt(this.velX * this.velX + this.velY * this.velY);
      if (speed > this.maxSpeed) {
        let ratio = this.maxSpeed / speed;
        this.velX *= ratio;
        this.velY *= ratio;
      }
      
      this.x += this.velX;
      this.y += this.velY;
      
      if (this.x < 0) { this.x = 0; this.velX = 0; }
      if (this.x > width - this.w) { this.x = width - this.w; this.velX = 0; }
      
      if (this.alfaEscudo > 0) this.alfaEscudo -= 15;
      if (this.cooldown > 0) this.cooldown--;
      if (this.energia < this.maxEnergia) this.energia += 0.4; 
    }
    
    destellarEscudo() { this.alfaEscudo = 180; }
    
    dibujar() { 
      dibujarEstructuraNave(naveSeleccionada, this.x, this.y, true); 
      if (this.alfaEscudo > 0) {
        stroke(0, 190, 255, this.alfaEscudo); strokeWeight(3); noFill();
        ellipse(this.x + this.w/2, this.y + this.h/2, this.w + 12, this.w + 12);
        noStroke();
      }
    }
    
    disparar() {
      if (estadoJuego !== "JUGANDO" || this.cooldown > 0) return;
      
      let costoEnergia = 12;
      let cdArma = 12;
      let dmg = 1;
      
      if (this.weaponType === "Railgun") { costoEnergia = 30; cdArma = 35; dmg = 3; }
      else if (this.weaponType === "Quantum Pulse") { costoEnergia = 8; cdArma = 7; dmg = 0.8; }
      else if (this.weaponType === "Plasma Mortar") { costoEnergia = 40; cdArma = 45; dmg = 5; }
      else if (this.weaponType === "Vortex Emitter") { costoEnergia = 15; cdArma = 14; dmg = 1.5; }
      else if (this.weaponType === "Fusion Missiles") { costoEnergia = 25; cdArma = 28; dmg = 3.5; }

      if (this.energia >= costoEnergia) {
        this.energia -= costoEnergia;
        this.cooldown = cdArma;
        reproducirSonidoLaserJugador();
        
        if (this.weaponType === "Railgun") {
          proyectiles.push(new Proyectil(this.x + this.w / 2, this.y, 0, 22, dmg, "Railgun", color(0, 255, 255)));
        } 
        else if (this.weaponType === "Quantum Pulse") {
          proyectiles.push(new Proyectil(this.x + 8, this.y, -0.5, 14, dmg, "Quantum", color(50, 255, 150)));
          proyectiles.push(new Proyectil(this.x + this.w - 8, this.y, 0.5, 14, dmg, "Quantum", color(50, 255, 150)));
        } 
        else if (this.weaponType === "Plasma Mortar") {
          proyectiles.push(new Proyectil(this.x + this.w / 2, this.y, 0, 7, dmg, "Mortar", color(255, 69, 0)));
        } 
        else if (this.weaponType === "Vortex Emitter") {
          proyectiles.push(new Proyectil(this.x + 4, this.y, -1.5, 11, dmg, "Vortex", color(150, 0, 255)));
          proyectiles.push(new Proyectil(this.x + this.w / 2, this.y, 0, 12, dmg, "Vortex", color(150, 0, 255)));
          proyectiles.push(new Proyectil(this.x + this.w - 4, this.y, 1.5, 11, dmg, "Vortex", color(150, 0, 255)));
        } 
        else if (this.weaponType === "Fusion Missiles") {
          proyectiles.push(new Proyectil(this.x, this.y + 6, -0.2, 10, dmg, "Missile", color(255, 200, 0)));
          proyectiles.push(new Proyectil(this.x + this.w, this.y + 6, 0.2, 10, dmg, "Missile", color(255, 200, 0)));
        }
      }
    }
    
    repararEscudo(cant) { this.escudo = constrain(this.escudo + cant, 0, this.escudoMax); }
  }

  class EnemigoAlien {
    constructor(x, y, velX, tipo) {
      this.x = x; this.y = y; this.tipo = tipo; this.velX = velX;
      let factorAtaque = dificultadSeleccionada === 2 ? 0.018 : (dificultadSeleccionada === 1 ? 0.009 : 0.005);
      
      if (this.tipo === 1) { 
        this.w = 42; this.h = 28; this.vidaMax = 1; this.colorEfecto = color(0, 255, 120); this.probabilidadDisparo = factorAtaque;
      } else if (this.tipo === 2) { 
        this.w = 46; this.h = 32; this.vidaMax = 2; this.colorEfecto = color(160, 40, 255); this.probabilidadDisparo = factorAtaque * 1.2;
      } else if (this.tipo === 3) { 
        this.w = 52; this.h = 36; this.vidaMax = 3; this.colorEfecto = color(255, 130, 0); this.probabilidadDisparo = factorAtaque * 0.8;
      } else { 
        this.w = 56; this.h = 40; this.vidaMax = 4; this.colorEfecto = color(0, 210, 255); this.probabilidadDisparo = factorAtaque * 1.4;
      }
      this.vidaActual = this.vidaMax;
    }
    actualizar() { this.x += this.velX; }
    recibirDanio(dmg) { this.vidaActual -= dmg; return this.vidaActual <= 0; }
    disparar() { 
      if (estadoJuego !== "JUGANDO") return;
      reproducirSonidoLaserEnemigo(); 
      if (this.tipo === 1) {
        laserEnemigos.push(new LaserEnemigo(this.x + this.w / 2, this.y + this.h, 0, "NORMAL")); 
      } else if (this.tipo === 2) { 
        laserEnemigos.push(new LaserEnemigo(this.x, this.y + this.h, -1.2, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w, this.y + this.h, 1.2, "NORMAL"));
      } else if (this.tipo === 3) { 
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, 0, "MINA"));
      } else { 
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, -1.8, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, 0, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, 1.8, "NORMAL"));
      }
    }
    dibujar() { dibujarEnemigoRealista(this.tipo, this.x, this.y, this.w, this.h, this.colorEfecto); }
    tocaBorde() { return (this.x + this.w > width || this.x < 0); }
    rebotar() { this.velX *= -1; this.y += 24; }
  }

  class MegaJefeInvasor {
    constructor(x, y, nivel) {
      this.x = x; this.y = y; this.w = 175; this.h = 80; this.nivel = nivel;
      this.velX = (2.2 + (nivel * 0.2)) * multiplicadorDificultad;
      
      if (nivel === 1) {
        this.nombre = "GOLIAT MINERO";
        this.colorEfecto = color(130, 140, 150); 
        this.vidaMax = Math.floor(30 * multiplicadorDificultad);
        this.probabilidadDisparo = 0.040;
      } else if (nivel === 2) {
        this.nombre = "TORMENTA DE VACÍO";
        this.colorEfecto = color(180, 20, 240); 
        this.vidaMax = Math.floor(45 * multiplicadorDificultad);
        this.probabilidadDisparo = 0.055;
      } else if (nivel === 3) {
        this.nombre = "ENJAMBRE MAESTRO";
        this.colorEfecto = color(0, 230, 100); 
        this.vidaMax = Math.floor(65 * multiplicadorDificultad);
        this.probabilidadDisparo = 0.065;
      } else {
        this.nombre = "DESTRUCTOR APOCALIPSIS";
        this.colorEfecto = color(255, 10, 50); 
        this.vidaMax = Math.floor((80 + (nivel * 10)) * multiplicadorDificultad);
        this.probabilidadDisparo = 0.075;
      }
      this.vidaActual = this.vidaMax;
    }

    actualizar() { 
      if (this.y < 85) { 
        this.y += 1.8; 
      } else { 
        this.x += this.velX; 
        if (this.x + this.w > width || this.x < 0) { 
          this.velX *= -1; 
          this.y += 14; 
        } 
      } 
    }

    recibirDanio(dmg) { this.vidaActual -= dmg; return this.vidaActual <= 0; }

    disparar() { 
      if (estadoJuego !== "JUGANDO") return;
      reproducirSonidoLaserEnemigo(); 
      
      if (this.nivel === 1) {
        laserEnemigos.push(new LaserEnemigo(this.x + 30, this.y + this.h, -0.6, "MINA"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, 0, "MINA"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w - 30, this.y + this.h, 0.6, "MINA"));
      } 
      else if (this.nivel === 2) {
        laserEnemigos.push(new LaserEnemigo(this.x + 15, this.y + this.h, -1.8, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + 55, this.y + this.h, -0.8, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w - 55, this.y + this.h, 0.8, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w - 15, this.y + this.h, 1.8, "NORMAL"));
      } 
      else if (this.nivel === 3) {
        for (let k = -2; k <= 2; k++) {
          laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, k * 1.4, "NORMAL"));
        }
      } 
      else {
        laserEnemigos.push(new LaserEnemigo(this.x + 20, this.y + this.h, -1.5, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2, this.y + this.h, 0, "MINA"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2 - 25, this.y + this.h, -0.5, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w/2 + 25, this.y + this.h, 0.5, "NORMAL"));
        laserEnemigos.push(new LaserEnemigo(this.x + this.w - 20, this.y + this.h, 1.5, "NORMAL"));
      }
    }

    dibujar() { 
      push(); translate(this.x, this.y); noStroke(); 
      if (this.nivel === 1) { 
        fill(45, 50, 58); rect(0, 10, this.w, this.h - 20, 8);
        fill(75, 80, 90); rect(25, 0, this.w - 50, this.h, 4);
        fill(this.colorEfecto); ellipse(this.w/2, this.h/2, 34, 20); 
      } 
      else if (this.nivel === 2) { 
        fill(50, 20, 70); triangle(this.w/2, this.h, 0, 0, this.w, 0);
        fill(90, 40, 130); quad(30, 0, this.w - 30, 0, this.w/2 + 15, this.h - 15, this.w/2 - 15, this.h - 15);
        fill(0, 255, 255); ellipse(this.w/2, 20, 12, 12); 
      } 
      else if (this.nivel === 3) { 
        fill(15, 50, 30); beginShape(); vertex(20, 0); vertex(this.w - 20, 0); vertex(this.w, this.h/2); vertex(this.w - 35, this.h); vertex(35, this.h); vertex(0, this.h/2); endShape(CLOSE);
        fill(40, 110, 70); ellipse(this.w/2, this.h/2, 45, 25);
        fill(255); ellipse(this.w/2 - 12, this.h/2, 4, 4); ellipse(this.w/2 + 12, this.h/2, 4, 4); 
      } 
      else { 
        fill(35, 10, 15); rect(10, 10, this.w - 20, this.h - 10, 14);
        fill(70, 20, 25); beginShape(); vertex(0, 20); vertex(this.w, 20); vertex(this.w - 25, this.h); vertex(25, this.h); endShape(CLOSE);
        fill(this.colorEfecto); rect(45, 5, this.w - 90, 10); 
        fill(255, 200, 0); ellipse(25, this.h - 5, 10, 10); ellipse(this.w - 25, this.h - 5, 10, 10); 
      }
      if (random(1) > 0.3) {
        fill(this.colorEfecto.levels[0], this.colorEfecto.levels[1], this.colorEfecto.levels[2], 120);
        rect(35, -5, 16, 6); rect(this.w - 51, -5, 16, 6);
      }
      pop(); 
    }
  }

  class Proyectil {
    constructor(x, y, velX, velY, damage, weaponType, colorVisual) { 
      this.x = x; this.y = y; 
      this.velX = velX; this.velY = velY; 
      this.damage = damage;
      this.weaponType = weaponType;
      this.colorV = colorVisual;
      
      if (weaponType === "Railgun") { this.w = 3; this.h = 24; }
      else if (weaponType === "Mortar") { this.w = 14; this.h = 14; }
      else if (weaponType === "Missile") { this.w = 6; this.h = 16; }
      else { this.w = 4; this.h = 12; }
    }
    
    actualizar() { 
      this.y -= this.velY; 
      this.x += this.velX; 
    }
    
    dibujar() { 
      fill(this.colorV);
      if (this.weaponType === "Mortar") {
        ellipse(this.x, this.y, this.w);
        fill(255, 200, 100, 150);
        ellipse(this.x, this.y, this.w + sin(frameCount * 0.5) * 4);
      } else {
        rect(this.x - this.w/2, this.y, this.w, this.h, 2); 
      }
    }
    
    fueraDePantalla() { return this.y < -50 || this.x < -20 || this.x > width + 20; }
    colisionaCon(entidad) { if(!entidad) return false; return (this.x > entidad.x && this.x < entidad.x + entidad.w && this.y > entidad.y && this.y < entidad.y + entidad.h); }
  }

  class LaserEnemigo {
    constructor(x, y, velX = 0, tipo = "NORMAL") { 
      this.x = x; this.y = y; this.tipo = tipo; this.velX = velX; 
      if (this.tipo === "MINA") {
        this.w = 14; this.h = 14; this.velY = 3.2 + dificultadSeleccionada * 0.5;
      } else {
        this.w = 4; this.h = 16; this.velY = 6.0 + dificultadSeleccionada;
      }
    }
    actualizar() { this.y += this.velY; this.x += this.velX; }
    dibujar() { 
      if (this.tipo === "MINA") {
        fill(255, 140, 0); ellipse(this.x, this.y, this.w);
        fill(255, 255, 200, 180); ellipse(this.x, this.y, this.w - 6);
      } else {
        fill(255, 10, 60); rect(this.x - this.w/2, this.y, this.w, this.h, 2); 
      }
    }
    fueraDePantalla() { return this.y > height || this.x < 0 || this.x > width; }
    colisionaConJugador(j) { if(!j) return false; return (this.x > j.x && this.x < j.x + j.w && this.y > j.y && this.y < j.y + j.h); }
  }

  class PowerUp {
    constructor(x, y) { this.x = x; this.y = y; this.radio = 11; this.vel = 2.5; }
    actualizar() { this.y += this.vel; }
    dibujar() { 
      fill(0, 255, 150); ellipse(this.x, this.y, this.radio * 2); 
      stroke(255, 150); strokeWeight(1); noFill(); ellipse(this.x, this.y, this.radio * 2 + sin(frameCount * 0.2) * 4); noStroke();
      fill(255); textAlign(CENTER, CENTER); textSize(11); textStyle(BOLD); text("H", this.x, this.y); textStyle(NORMAL);
    }
    fueraDePantalla() { return this.y > height; }
    colisionaConJugador(j) { if(!j) return false; return (this.x > j.x && this.x < j.x + j.w && this.y > j.y && this.y < j.y + j.h); }
  }

  class Particula {
    constructor(x, y, col, vx, vy, t = null) { this.x = x; this.y = y; this.velX = vx; this.velY = vy; this.alfa = 255; this.colorP = col; this.tam = t ? t : random(2.0, 6.0); }
    actualizar() { this.x += this.velX; this.y += this.velY; this.alfa -= 9; }
    dibujar() { if(this.alfa <= 0) return; this.colorP.setAlpha(this.alfa); fill(this.colorP); noStroke(); ellipse(this.x, this.y, this.tam); }
    estaMuerta() { return this.alfa <= 0; }
  }
</script>
